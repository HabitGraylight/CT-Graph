name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Check public files and history
        run: python scripts/check_publication.py
      - name: Initialize an empty local workspace
        run: python scripts/init_local.py
      - run: python -X utf8 -m unittest discover -s tests -q
      - run: node --check web/app.js
      - run: node --check web/judge.js
