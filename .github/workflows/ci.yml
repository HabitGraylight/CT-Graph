name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Check public files and history
        run: python scripts/check_publication.py
      - name: Initialize an empty local workspace
        run: python scripts/init_local.py
      - run: python -X utf8 -m unittest discover -s tests -q
      - run: node --check web/app.js
      - run: node --check web/judge.js
      - run: node --check web/lab.js
      - run: node --check cloud/web/app.js
      - run: python scripts/build_cloud.py
  cloud-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --prefix tests/database --ignore-scripts
      - run: npm test --prefix tests/database
      - run: npm ci --prefix tests/web --ignore-scripts
      - run: npm test --prefix tests/web
